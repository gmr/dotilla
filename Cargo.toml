[package]
name = "dotilla"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.5", features = ["derive"] }
fjall = "3.1.8"
serde = { version = "1", features = ["derive"] }
shellexpand = { version = "3.1.2", features = ["path"] }
tempfile = "3"
thiserror = "2.0.19"
tokio = { version = "1", features = ["full"] }
toml = "1.1.4"
