[package]
name = "dotilla"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.5", features = ["derive"] }
fjall = { version = "3", features = ["lz4", "metrics"] }
icu = "2.2.0"
lancedb = "0.33.0"
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
shellexpand = { version = "3.1.2", features = ["path"] }
tempfile = "3"
thiserror = "2.0.19"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7.19"
toml = "1.1.4"
tower-http = { version = "0.7.0", features = ["timeout"] }
tree-sitter = "0.26.11"
tree-sitter-cypher = "0.2.6"


[dev-dependencies]
assert_cmd = "2"
http-body-util = "0.1.4"
predicates = "3"
reqwest = { version = "0.13.4", features = ["json"] }
tower = { version = "0.5.3", features = ["util"] }
