[package]
name = "dotilla"
version = "0.1.0"
edition = "2024"

[dependencies]
apache-avro = { version = "0.22.0", features = ["derive", "snappy"] }
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.5", features = ["derive"] }
compio = { version = "0.19.2", features = ["macros", "fs", "signal"] }
convert_case = "0.11.0"
cyper-axum = { version = "0.9.0", features = ["enable_log", "http2"] }
fjall = { version = "3", features = ["lz4", "metrics"] }
futures = "0.3.34"
futures-util = "0.3.34"
icu = "2.2.0"
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
shellexpand = { version = "3.1.2", features = ["path"] }
strum = { version = "0.26", features = ["derive"] }
tempfile = "3"
test-context = { version = "0.3" }
thiserror = "2.0.19"
toml = "1.1.4"

[dev-dependencies]
assert_cmd = "2"
axum-test = "21.1.0"
fastrand = "2"
gherkin = "0.16.0"
http-body-util = "0.1.4"
predicates = "3"
tower = { version = "0.5.3", features = ["util"] }
