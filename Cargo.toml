[package]
name = "dotilla"
version = "0.1.0"
edition = "2024"

[dependencies]
apache-avro = { version = "0.22.0", features = ["derive", "snappy"] }
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.5", features = ["derive"] }
convert_case = "0.11.0"
fjall = { version = "3", features = ["lz4", "metrics"] }
futures = "0.3.34"
icu = "2.2.0"
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
shellexpand = { version = "3.1.2", features = ["path"] }
strum = { version = "0.26", features = ["derive"] }
tempfile = "3"
test-context = { version = "0.3" }
thiserror = "2.0.19"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7.19"
toml = "1.1.4"
tower-http = { version = "0.7.0", features = ["timeout"] }
tree-sitter = "0.26.11"
tree-sitter-cypher = "0.2.6"

[dev-dependencies]
assert_cmd = "2"
fastrand = "2"
http-body-util = "0.1.4"
predicates = "3"
reqwest = { version = "0.13.4", features = ["json"] }
tower = { version = "0.5.3", features = ["util"] }
